<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tales Runner dye color picker — get Color, Intensity and Brightness values from any image. Created by Afallen.">
    <title>Tales Runner Color Picker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="colorPickerContainer">
        <div id="colorPickerGroup">
            <canvas id="colorCanvas"></canvas><br>
            <input type="file" id="imageInput" accept="image/*"><br><br>
        </div>
        <label for="colorResult">Color:</label>
        <input type="text" id="colorResult" readonly>
        <label for="intensityResult">Intensity:</label>
        <input type="text" id="intensityResult" readonly>
        <label for="brightnessResult">Brightness:</label>
        <input type="text" id="brightnessResult" readonly>
        <br><br>
        <p>Coded by Afallen | <a href='https://ko-fi.com/N4N61R1V56' target='_blank'><img height='36' style='border:0px;height:36px;' src='https://storage.ko-fi.com/cdn/kofi4.png?v=6' border='0' alt='Buy Me a Coffee at ko-fi.com' /></a>
        &nbsp;|&nbsp; <a href="v2/index.html" style="font-size:0.85rem;color:#c94e28;font-weight:bold;">Try v2 →</a></p>
    </div>
    
    <div id="magnifier"></div>

    <!-- v2 Modal -->
    <div id="v2Overlay">
        <div id="v2Modal">
            <h2>Version 2 is available</h2>
            <ul id="v2Changes">
                <li>Suggested colors based on your pick</li>
                <li>Saveable palette with names and notes</li>
                <li>Export as JSON or PNG</li>
                <li>Drag to reorder palette entries</li>
                <li>Keyboard navigation and undo support</li>
            </ul>
            <div id="v2ModalButtons">
                <button id="v2Yes">Try v2</button>
                <button id="v2No">Stay here</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
